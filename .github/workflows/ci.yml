name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows)
    # This canonical pull-request job stays on a disposable hosted VM. Trusted main pushes and
    # manual dispatches use the PiPlay runner label after PIPLAY_WINDOWS_RUNNER is configured;
    # leaving the variable unset is the safe hosted fallback while infrastructure is serviced.
    # A registered runner for a public repo must still be disposable: contributed workflows can
    # propose targeting its label directly, outside this job's routing expression.
    runs-on: ${{ case(github.event_name == 'pull_request', 'windows-latest', vars.PIPLAY_WINDOWS_RUNNER || 'windows-latest') }}
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up Node for executable DOM tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run deterministic local CI gate
        shell: pwsh
        run: .\scripts\Test-LocalCI.ps1

      - name: Build and validate desk candidate
        if: github.event_name == 'workflow_dispatch'
        id: desk-candidate
        shell: pwsh
        run: |
          Get-Command git -CommandType Application -ErrorAction Stop | Out-Null
          $global:LASTEXITCODE = 0
          $sourceStatus = @(& git status --porcelain --untracked-files=all)
          $sourceStatusExitCode = $LASTEXITCODE
          if ($sourceStatusExitCode -ne 0) {
            throw "Required git status query failed (exit $sourceStatusExitCode); source cleanliness is unknown."
          }
          $sourceDirtyEntries = @($sourceStatus | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($sourceDirtyEntries.Count -ne 0) {
            throw ("Desk-candidate source tree must be clean. Dirty entries:`n" +
              ($sourceDirtyEntries -join [Environment]::NewLine))
          }

          $publishRoot = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'PiPlay-desk-candidate-publish'))
          if (-not [System.IO.Path]::IsPathFullyQualified($publishRoot)) {
            throw "Desk-candidate publish root is not fully qualified: $publishRoot"
          }

          $publishLabel = "desk-candidate-$env:GITHUB_SHA"
          $expectedPayloadRoot = [System.IO.Path]::GetFullPath((Join-Path $publishRoot $publishLabel))
          $nonReleaseReason = 'GitHub Actions desk candidate; final interactive verification pending on SND-DESK'

          & pwsh -NoProfile -File .\scripts\Build-PiPlay.ps1 `
            -Stage Publish `
            -Configuration Release `
            -Channel Stable `
            -NoVersionBump `
            -NoBuildNumberBump `
            -PublishRoot $publishRoot `
            -PublishLabel $publishLabel `
            -NoLatest `
            -NoVersionTable `
            -StopProcessName '' `
            -NonReleaseReason $nonReleaseReason
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            throw "Desk-candidate build failed (exit $buildExitCode)."
          }

          if (-not (Test-Path -LiteralPath $expectedPayloadRoot -PathType Container)) {
            throw "Desk-candidate payload was not created at the expected path: $expectedPayloadRoot"
          }
          $payloadRoot = (Get-Item -LiteralPath $expectedPayloadRoot).FullName
          if (-not [string]::Equals(
              [System.IO.Path]::GetFullPath($payloadRoot),
              $expectedPayloadRoot,
              [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Desk-candidate payload resolved outside its expected path: $payloadRoot"
          }

          $manifestPath = Join-Path $payloadRoot 'build-info.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Desk-candidate manifest is missing: $manifestPath"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $requiredProperties = @(
            'sourceCommit', 'sourceDirty', 'sourceDirtyEntries', 'releaseEvidence',
            'releaseEvidenceReason', 'channel', 'configuration', 'publishLabel'
          )
          foreach ($propertyName in $requiredProperties) {
            if (-not $manifest.PSObject.Properties[$propertyName]) {
              throw "Desk-candidate manifest is missing '$propertyName'."
            }
          }

          if ([string]$manifest.sourceCommit -cne $env:GITHUB_SHA) {
            throw "Desk-candidate sourceCommit does not match GITHUB_SHA."
          }
          if ($manifest.sourceDirty -isnot [bool] -or $manifest.sourceDirty) {
            throw "Desk-candidate sourceDirty must be false."
          }
          if (@($manifest.sourceDirtyEntries).Count -ne 0) {
            throw "Desk-candidate sourceDirtyEntries must be empty."
          }
          if ($manifest.releaseEvidence -isnot [bool] -or $manifest.releaseEvidence) {
            throw "Desk-candidate releaseEvidence must be false."
          }
          if ([string]$manifest.releaseEvidenceReason -cne $nonReleaseReason) {
            throw "Desk-candidate releaseEvidenceReason does not match the required reason."
          }
          if ([string]$manifest.channel -cne 'Stable') {
            throw "Desk-candidate channel must be Stable."
          }
          if ([string]$manifest.configuration -cne 'Release') {
            throw "Desk-candidate configuration must be Release."
          }
          if ([string]$manifest.publishLabel -cne $publishLabel) {
            throw "Desk-candidate publishLabel does not match its expected path."
          }

          $packagedSmoke = Join-Path $payloadRoot 'scripts\Test-UiSmoke.ps1'
          & pwsh -NoProfile -File $packagedSmoke -Mode DeskCandidate -ValidateOnly
          $smokeExitCode = $LASTEXITCODE
          if ($smokeExitCode -ne 0) {
            throw "Packaged desk-candidate preflight failed (exit $smokeExitCode)."
          }

          "payload=$payloadRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload desk candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PiPlay-desk-candidate-${{ github.sha }}
          path: ${{ steps.desk-candidate.outputs.payload }}
          if-no-files-found: error
